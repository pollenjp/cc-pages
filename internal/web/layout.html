{{define "layout"}}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/_/style.css">
<!-- 本文幅の記憶を最初の描画より前に反映する。defer / async にするとちらつく。 -->
<script src="/_/width.js"></script>
<!-- 画像の拡大。最初の描画より前に要る仕事が無いので defer でよい。 -->
<script src="/_/lightbox.js" defer></script>
</head>
<body>
<header class="bar">
  <a href="/">cc-pages</a>
  <span class="crumb">{{if .SessionURL}}<a href="{{.SessionURL}}">{{.SessionTitle}}</a> / {{end}}{{.Crumb}}</span>
  {{if .ShowSearch}}<form method="get" action="/" style="display:contents">
    <input type="search" name="q" value="{{.Query}}" placeholder="タイトル・要約・タグ・依頼・cwd・ブランチ" autofocus>
  </form>{{end}}
  <button type="button" class="widthtoggle"><span class="to-full">全幅にする</span><span class="to-narrow">標準幅にする</span></button>
  <form method="post" action="/_/touch" style="display:contents">
    <button type="submit">再読み込み</button>
  </form>
</header>
<main class="wrap">
{{template "body" .}}
</main>
</body>
</html>{{end}}
